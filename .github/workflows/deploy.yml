# Builds the backend and frontend images, pushes them to the private registry,
# then deploys by running deploy.sh over SSH on the VPS.
#
# Everything below reads from the "production" GitHub environment
# (Settings -> Environments -> production), so add these there:
#
#   Secrets
#     REGISTRY_USERNAME   login for registry.lucramassamy.fr
#     REGISTRY_PASSWORD   password / access token for that registry
#     SSH_HOST            VPS hostname or IP
#     SSH_USER            SSH user to connect as
#     SSH_PRIVATE_KEY     private key for that user, in full PEM form
#                         (-----BEGIN OPENSSH PRIVATE KEY----- ... including the
#                         trailing newline)
#     SSH_KNOWN_HOSTS     output of: ssh-keyscan -H <your-vps-host>
#                         Pinning the host key here is what stops a
#                         man-in-the-middle from receiving the deploy key.
#
#   Variables
#     VITE_BACKEND_URL    public API base URL, e.g. https://api.lucramassamy.fr
#                         A variable rather than a secret because Vite bakes it
#                         into the static bundle, where it is public anyway.
#     SSH_PORT            optional, defaults to 22

name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: registry.lucramassamy.fr
  BACKEND_IMAGE: discord-clone-backend
  FRONTEND_IMAGE: discord-clone-frontend

# Never let two deploys race each other onto the VPS.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-backend:
    name: Build and push backend
    runs-on: ubuntu-latest
    environment: DEPLOY-BUILD
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to the registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: backend/back
          file: backend/back/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:latest
            ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  build-frontend:
    name: Build and push frontend
    runs-on: ubuntu-latest
    environment: DEPLOY-BUILD
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Check VITE_BACKEND_URL is set
        # Vite bakes this into the bundle, so an empty value silently ships a
        # frontend that falls back to its own origin for API calls. Fail loudly
        # here instead of shipping a broken build.
        run: |
          if [ -z "${{ vars.VITE_BACKEND_URL }}" ]; then
            echo "::error::VITE_BACKEND_URL is not set on the production environment"
            exit 1
          fi

      - uses: docker/setup-buildx-action@v3

      - name: Log in to the registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: frontend/front
          file: frontend/front/Dockerfile
          push: true
          build-args: |
            VITE_BACKEND_URL=${{ vars.VITE_BACKEND_URL }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    name: Deploy to VPS
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-latest
    environment: DEPLOY-BUILD
    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Run deploy.sh
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ vars.SSH_PORT || '22' }}
        run: |
          # Single quotes keep ~ unexpanded locally so the remote shell resolves
          # it against the deploy user's home. deploy.sh pulls :latest itself.
          ssh -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            'bash -lc "~/discord-clone/deploy.sh"'

      - name: Remove the deploy key
        if: always()
        run: rm -f ~/.ssh/deploy_key
