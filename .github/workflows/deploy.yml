# Builds the backend and frontend images, pushes them to the private registry,
# then deploys by running deploy.sh over SSH on the VPS.
#
# Everything below reads from the "DEPLOY-BUILD" GitHub environment
# (Settings -> Environments -> DEPLOY-BUILD), so add these there. A value put on
# a different environment, or added as a Secret where a Variable is expected,
# reads as empty here.
#
#   Secrets
#     REGISTRY_USERNAME   login for registry.lucramassamy.fr
#     REGISTRY_PASSWORD   password / access token for that registry
#     SSH_HOST            VPS hostname or IP
#     SSH_USER            SSH user to connect as
#     SSH_PRIVATE_KEY     private key for that user, in full PEM form
#                         (-----BEGIN OPENSSH PRIVATE KEY----- ... including the
#                         trailing newline)
#     SSH_KNOWN_HOSTS     output of: ssh-keyscan -H <your-vps-host>
#                         Pinning the host key here is what stops a
#                         man-in-the-middle from receiving the deploy key.
#
#   Variables
#     VITE_BACKEND_URL    public API base URL, WITH scheme and no trailing
#                         slash, e.g. https://discord-api.lucramassamy.fr
#                         A Variable rather than a Secret because Vite bakes it
#                         into the static bundle, where it is public anyway --
#                         and because a Secret would be masked in the build log
#                         and unreadable by the check step below.
#     SSH_PORT            optional, defaults to 22

name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: registry.lucramassamy.fr
  BACKEND_IMAGE: discord-clone-backend
  FRONTEND_IMAGE: discord-clone-frontend

# Never let two deploys race each other onto the VPS.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-backend:
    name: Build and push backend
    runs-on: ubuntu-latest
    environment: DEPLOY-BUILD
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to the registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: backend/back
          file: backend/back/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:latest
            ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  build-frontend:
    name: Build and push frontend
    runs-on: ubuntu-latest
    environment: DEPLOY-BUILD
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Check VITE_BACKEND_URL is set
        # Vite bakes this into the bundle at build time. If it is empty,
        # constants.ts falls back to window.location.origin, so every /api call
        # goes to the SPA's own nginx -- which has no /api location and answers
        # 405 Not Allowed to any POST (e.g. login). Fail loudly here instead.
        # Read via env, not inline expansion, so the value can't inject shell.
        env:
          VITE_BACKEND_URL: ${{ vars.VITE_BACKEND_URL }}
        run: |
          if [ -z "$VITE_BACKEND_URL" ]; then
            echo "::error::VITE_BACKEND_URL is empty. Set it as a Variable (not a Secret) on the DEPLOY-BUILD environment."
            exit 1
          fi
          case "$VITE_BACKEND_URL" in
            http://*|https://*) ;;
            *) echo "::error::VITE_BACKEND_URL must include the scheme, got '$VITE_BACKEND_URL'"; exit 1 ;;
          esac
          echo "Building the frontend against $VITE_BACKEND_URL"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to the registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: frontend/front
          file: frontend/front/Dockerfile
          push: true
          build-args: |
            VITE_BACKEND_URL=${{ vars.VITE_BACKEND_URL }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Verify the API URL is in the built bundle
        # The build arg can be silently dropped (wrong ARG name, cache reuse,
        # Dockerfile drift) and the result still builds fine -- it just ships a
        # frontend that calls the wrong host. Assert on the artifact itself.
        env:
          VITE_BACKEND_URL: ${{ vars.VITE_BACKEND_URL }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
        run: |
          docker pull "$IMAGE"
          if docker run --rm --entrypoint sh "$IMAGE" -c \
               "grep -rqF '$VITE_BACKEND_URL' /usr/share/nginx/html/assets/"; then
            echo "OK: $VITE_BACKEND_URL is baked into the bundle"
          else
            echo "::error::$VITE_BACKEND_URL is NOT in the built bundle -- the frontend would fall back to its own origin and get 405 on /api POSTs"
            exit 1
          fi

  deploy:
    name: Deploy to VPS
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-latest
    environment: DEPLOY-BUILD
    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Run deploy.sh
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ vars.SSH_PORT || '22' }}
        run: |
          # Single quotes keep ~ unexpanded locally so the remote shell resolves
          # it against the deploy user's home. deploy.sh pulls :latest itself.
          ssh -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            'cd discord-clone && bash -lc "./deploy.sh"'

      - name: Remove the deploy key
        if: always()
        run: rm -f ~/.ssh/deploy_key
