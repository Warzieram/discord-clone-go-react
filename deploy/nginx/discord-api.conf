# Reverse proxy for the Go backend: discord-api.lucramassamy.fr -> app:8080
#
# Install on the VPS as /etc/nginx/sites-available/discord-api.conf, symlink into
# sites-enabled, then `nginx -t && systemctl reload nginx`.
# TLS lines assume certbot; run `certbot --nginx -d discord-api.lucramassamy.fr`
# and it will manage the certificate paths for you.
#
# The two things that are easy to get wrong here:
#   1. Without the Upgrade/Connection headers the websocket handshake on
#      /api/message fails, so chat silently never connects even though login
#      works. That needs proxy_http_version 1.1 as well -- the default 1.0
#      cannot upgrade.
#   2. The default proxy_read_timeout of 60s drops idle websockets after a
#      minute. The app's own idle timeout is 1800s, so allow more than that.

# $connection_upgrade must live in the http{} context, NOT inside server{}.
# On Debian/Ubuntu put this block in /etc/nginx/conf.d/websocket.conf so it is
# included once, globally. If nginx complains that the map is a duplicate, it is
# already defined somewhere (some distros ship it) -- drop this block then.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name discord-api.lucramassamy.fr;

    # certbot replaces this with a redirect to https once it runs
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name discord-api.lucramassamy.fr;

    ssl_certificate     /etc/letsencrypt/live/discord-api.lucramassamy.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/discord-api.lucramassamy.fr/privkey.pem;

    # Verification links and JSON payloads are small; keep this tight.
    client_max_body_size 1m;

    location / {
        # If nginx runs on the host, point this at the published port of the
        # backend container (docker-compose publishes 8080). If nginx itself runs
        # as a container on the same compose network, use http://app:8080.
        proxy_pass http://127.0.0.1:8080;

        proxy_http_version 1.1;

        # Websocket upgrade for /api/message
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long enough that an idle chat connection outlives the app's own
        # 1800s idle timeout rather than being cut by the proxy first.
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;

        # Streamed websocket frames must not sit in a buffer.
        proxy_buffering off;
    }
}
